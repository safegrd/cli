# SafeGrd CLI (node daemon) Configuration Example - safegrd.dev
#
# For the `safegrd` binary. Copy to ~/.safegrd/config.yaml (the default
# location) or pass it with `safegrd --config <path>`.
#
# For the remote server (attestation, scheduling, alerts), see https://safegrd.dev/docs.
#
# Contains connection strings and key paths: never commit a filled-in copy.
#
# The Age *private* key is never written here: `init` puts it at `key_path`
# with 0600 permissions, and it is resolved from there or from
# SAFEGRD_PRIVATE_KEY at load. This file still holds connection strings, so
# keep it 0600 and do not commit a filled-in copy.

# The remote server this host reports to. `safegrd enroll` writes the token.
server:
  url: "https://safegrd.dev"
  token: "" # sg_tok_..., or SAFEGRD_SERVER_TOKEN

# Who this host is to the remote server. `init` and `enroll` write these.
node:
  id: "node-prod-db-primary"
  name: "prod-db-01"
  # project: "proj-..." # the project it was enrolled into

# What this host backs up. Every source is a surface; more examples follow
# further down.
surfaces:
  - id: "app"
    type: "postgres"
    database_url: "env:APP_DATABASE_URL" # or the URL itself, or file:/path

# Storage Backend: "s3" or "local"
storage:
  type: "local" # Use "s3" for AWS S3 / MinIO
  bucket: "my-safegrd-worm-backups" # Required if type: s3
  region: "us-east-1"
  endpoint: "" # Set for MinIO, Cloudflare R2, or Wasabi (e.g. http://localhost:9000)
  prefix: "safegrd/snapshots"
  retention_days: 30 # Days each backup is locked; a surface's retention_days overrides it
  # Exactly "COMPLIANCE" or "GOVERNANCE", uppercase, or leave it unset for
  # COMPLIANCE. Anything else is refused at startup rather than guessed at:
  # under COMPLIANCE an object cannot be deleted before retention_days expires,
  # by anyone. Lowercase "governance" is an error, not a synonym.
  worm_mode: "COMPLIANCE"
  local_path: "./safegrd-storage" # Used if type: local

# Client-Side Zero-Knowledge Encryption (Age / X25519)
encryption:
  # Recipient public key for encryption (never exposes the private key to the runner or the remote server)
  public_key: "age1..."
  # Path to local identity file containing private key (for restores/verifications)
  key_path: "~/.safegrd/keys/daemon.key"

# Alerts are not configured here. The remote server sends notifications
# (failed backups, failed or blocked Fire Drills, silent hosts, overdue surfaces, recoveries)
# to configured alert webhooks (Slack, Discord, or generic JSON).
# See https://safegrd.dev/docs/alerts.

# ===========================================================================
# Unattended multi-surface daemon: `safegrd daemon run`.
#
# `daemon run` reads everything below. A few keys are accepted but not yet
# acted on; each says so where it appears, and says what happens instead.
# See https://safegrd.dev/docs/daemon.
# ===========================================================================

# daemon:
#   # How often the daemon wakes to look for work. This is a POLL, not the
#   # schedule; per-surface `schedule` below decides when a backup actually
#   # runs. ±10% jitter is applied so a fleet does not stampede on the minute.
#   interval: "5m"
#
#   # State, locks and logs. Defaults to ~/.safegrd (user scope) or
#   # /var/lib/safegrd (system scope). Never put this on a network filesystem;
#   # the in-progress lock depends on working flock semantics.
#   state_dir: "~/.safegrd"
#
#   # Prometheus counters. NOT YET ACTED ON: no metrics endpoint exists.
#   metrics_addr: ""     # e.g. "127.0.0.1:9847"

# Defaults every surface inherits unless it overrides them.
# defaults:
#   schedule: "@daily"        # "@hourly" | "@daily" | "@weekly" | "6h" | "2d" (one hour minimum)
#   timezone: "UTC"           # NOT YET ACTED ON: schedules are intervals, not wall-clock times
#   # Grandfather-father-son, applied by the daemon at upload: the first backup of
#   # each UTC day is locked keep_daily days, of each ISO week keep_weekly weeks,
#   # of each month keep_monthly months, every other one the surface's
#   # retention_days, else storage.retention_days. 0 turns a tier off. An hourly
#   # schedule stays cheap with a short retention_days and keep_daily carrying
#   # the history.
#   keep_daily: 14
#   keep_weekly: 4
#   keep_monthly: 12

# More surfaces go under `surfaces:` at the top. Each becomes its own
# registered node on the remote server. `id` must be stable: it is how state,
# locks and snapshot history are keyed.
#
#   - id: "app-primary"
#     type: "postgres"
#     name: "Production PostgreSQL"
#     schedule: "@daily"
#     # Where the connection URL comes from. It carries a password, so the
#     # config names where to find it rather than holding it:
#     credential:
#       from: env                 # an environment variable on this host...
#       name: "APP_DATABASE_URL"
#     #   from: command           # ...your secret manager's output...
#     #   run: "op read op://vault/app-db/url"
#     #   from: file              # ...a mounted secret...
#     #   path: "/run/secrets/app-db-url"
#     #   from: safegrd           # ...or the remote server holds it, encrypted,
#     #                           # and gives it only to this host at backup time.
#     # ...or, instead of a credential block, inline a URL with no secret in it,
#     # for a passwordless local socket:
#     # database_url: "postgres://postgres@localhost:5432/myapp?sslmode=disable"
#     # Each run uploads only the chunks of each table that changed.
#     # format: "tar" keeps one archive per backup instead.
#     # format: "tar"
#     # Skip reading tables nothing wrote since the last run. This puts a
#     # trigger on each table and a safegrd schema in the database, which
#     # DROP SCHEMA safegrd CASCADE removes.
#     # change_log: true
#     # Commands run around each of the daemon's backups of this surface.
#     # pre_backup must succeed or the backup is skipped; post_backup always
#     # runs, with SAFEGRD_BACKUP_STATUS=success|failed.
#     # pre_backup: "psql \"$APP_DB\" -c 'CHECKPOINT'"
#     # post_backup: "logger safegrd backup $SAFEGRD_BACKUP_STATUS"
#     # A scratch database for Fire Drills: the drill restores the snapshot into
#     # it and counts what came back. It must hold nothing and be used for
#     # nothing else: the daemon refuses one with tables in it, refuses the
#     # database above, and empties it after each drill. Without it, on a plan
#     # with sandbox drills, a postgres surface restores into a throwaway
#     # cluster the daemon starts from this host's PostgreSQL server (initdb and
#     # postgres, the source's major or newer) and deletes afterwards. With no
#     # server here, drills replay the snapshot in memory.
#     # drill:
#     #   sandbox_url: "env:APP_DRILL_DATABASE_URL"
#
#   - id: "user-uploads"
#     type: "files"
#     name: "User upload tree"
#     schedule: "6h"
#     roots:
#       - "/var/www/uploads"
#       - "/srv/shared"
#     excludes:
#       - "*.tmp"
#       - "*.log"
#       - "cache/*"
#       - "node_modules/*"
#     # macOS: backing up ~/Documents, ~/Desktop or ~/Library/Mail requires Full
#     # Disk Access for the safegrd binary. Without it the read returns EMPTY
#     # rather than failing; `safegrd doctor` checks for this.
#
#   - id: "support-mailbox"
#     type: "email"
#     name: "support@example.com"
#     schedule: "@daily"
#     host: "imap.gmail.com"
#     port: 993
#     username: "support@example.com"
#     folders: ["INBOX", "Sent", "Archive"]
#     # The config NEVER holds the password itself. A command whose stdout is
#     # the secret works identically under launchd, systemd and a shell; a
#     # daemon inherits no login shell, so a bare variable is usually empty
#     # under a service.
#     credential:
#       from: command
#       run: "op read op://vault/support-mail/password"
#     # It runs under /bin/sh as the daemon's user, has 30 seconds, and a
#     # failure fails this surface; it never falls back to anything else.
#     # `safegrd doctor` runs it, so check it there first. from: env (with
#     # name), from: file (with path) and from: safegrd work as above.
#
#     # Per-surface storage override. Omit to inherit the top-level `storage`.
#     # storage:
#     #   type: "s3"
#     #   bucket: "mail-archive-worm"
#     #   retention_days: 365
