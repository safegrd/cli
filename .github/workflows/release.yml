name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# A published release is what `curl -fsSL https://safegrd.dev/install.sh | sh`
# installs the moment it appears on releases/latest, and what `brew upgrade`
# fetches next. So nothing is published until the exact archives about to be
# uploaded have been installed through install.sh and taken a backup through to
# a byte-identical restore on every platform a runner exists for.
jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Run CI gate
        run: make ci

  build:
    name: Build release archives
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # `make dist` stamps the binary with the short commit SHA.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      # Same target a maintainer runs locally to reproduce a release:
      #   make dist VERSION=0.0.1
      - name: Build release archives
        run: make dist VERSION="${GITHUB_REF_NAME#v}"

      - name: Keep them for the smoke test and the release
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  smoke:
    name: Install and restore (${{ matrix.os }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        # linux/amd64, linux/arm64 and darwin/arm64 run natively. darwin/amd64
        # is built but not executed here.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fetch the archives
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Install through install.sh and restore a backup
        run: sh scripts/release-smoke.sh dist "${GITHUB_REF_NAME#v}"

  release:
    name: Publish Release
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the archives that passed the smoke test
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "SafeGrd CLI $GITHUB_REF_NAME" \
            --generate-notes \
            dist/safegrd_*.tar.gz dist/checksums.txt

  homebrew:
    name: Update the Homebrew tap
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fetch the checksums
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # GITHUB_TOKEN cannot push to another repository, so this needs a
      # fine-grained token with contents:write on safegrd/homebrew-tap. Without
      # it the job fails rather than skipping: a tap that silently stops
      # following releases leaves `brew upgrade` customers on an old binary.
      - name: Commit the new formula to safegrd/homebrew-tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN is not set; the release is published but brew still installs the previous version."
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/safegrd/homebrew-tap.git" tap
          mkdir -p tap/Formula
          sh scripts/homebrew-formula.sh "$version" dist/checksums.txt > tap/Formula/safegrd.rb
          cd tap
          git config user.name "safegrd-release"
          git config user.email "release@safegrd.dev"
          git add Formula/safegrd.rb
          git diff --cached --quiet && { echo "formula already at $version"; exit 0; }
          git commit -m "safegrd ${version}"
          git push origin HEAD
