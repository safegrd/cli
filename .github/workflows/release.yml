name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# A published release is what `curl -fsSL https://safegrd.dev/install.sh | sh`
# installs the moment it appears on releases/latest, and what `brew upgrade`
# fetches next. So nothing is published until the exact archives about to be
# uploaded have been installed through install.sh and taken a backup through to
# a byte-identical restore on every platform a runner exists for, and the
# GitHub Action (safegrd/backup-action@v0) has backed up and drilled
# PostgreSQL, MySQL, MongoDB and a folder with them.
jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # make release-tag points them at the tag before tagging; a tag pushed
      # by hand would publish files that run another release.
      - name: Check the packaging files run this release
        run: sh scripts/packaging-version.sh check "${GITHUB_REF_NAME#v}"

      - name: Run CI gate
        run: make ci

  build:
    name: Build release archives
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # `make dist` stamps the binary with the short commit SHA.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Same target a maintainer runs locally to reproduce a release:
      #   make dist VERSION=0.0.1
      - name: Build release archives
        run: make dist VERSION="${GITHUB_REF_NAME#v}"

      - name: Keep them for the smoke test and the release
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  smoke:
    name: Install and restore (${{ matrix.os }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        # linux/amd64, linux/arm64 and darwin/arm64 run natively. darwin/amd64
        # is built but not executed here.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fetch the archives
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Install through install.sh and restore a backup
        run: sh scripts/release-smoke.sh dist "${GITHUB_REF_NAME#v}"

  # The Action's own test workflow, run against the archives above instead of
  # the latest release: what `uses: safegrd/backup-action@v0` does on a
  # customer's runner the moment this release is published.
  action:
    name: The GitHub Action
    needs: build
    permissions:
      contents: read
    uses: safegrd/backup-action/.github/workflows/test.yml@v0
    with:
      cli-version: ${{ github.ref_name }}
      dist-artifact: dist

  release:
    name: Publish Release
    needs: [smoke, action]
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the archives that passed the smoke test
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "SafeGrd CLI $GITHUB_REF_NAME" \
            --generate-notes \
            dist/safegrd_*.tar.gz dist/checksums.txt

  image:
    name: Publish the image
    # After the smoke test and the Action, like the archives: the image is the
    # same source, and nothing is published from a tag that has not restored a
    # backup.
    needs: [smoke, action]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Keyless signing: cosign gets a certificate for this workflow's identity.
      id-token: write
    env:
      IMAGE: ghcr.io/safegrd/cli
      # The Postgres client the image carries, named in its tag: pg_dump has
      # to be at least as new as the server it reads.
      PG_MAJOR: "18"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build arguments
        id: meta
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # Built for this runner and run before anything is pushed: the binary
      # starts and every dump client is on the PATH.
      - name: Build for a check
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: safegrd-cli:check
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.commit }}
            BUILD_DATE=${{ steps.meta.outputs.date }}
            PG_MAJOR=${{ env.PG_MAJOR }}

      - name: Check the image
        run: |
          docker run --rm safegrd-cli:check version | grep -F "${{ steps.meta.outputs.version }}"
          docker run --rm -e PG_MAJOR="$PG_MAJOR" --entrypoint sh safegrd-cli:check -c \
            'pg_dump --version | grep " ${PG_MAJOR}\." && mysqldump --version && mongodump --version'

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push linux/amd64 and linux/arm64
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.commit }}
            BUILD_DATE=${{ steps.meta.outputs.date }}
            PG_MAJOR=${{ env.PG_MAJOR }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}-pg${{ env.PG_MAJOR }}
            ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
            ${{ env.IMAGE }}:latest

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign the image
        run: cosign sign --yes "${IMAGE}@${{ steps.push.outputs.digest }}"

  homebrew:
    name: Update the Homebrew tap
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fetch the checksums
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # GITHUB_TOKEN cannot push to another repository, so this needs a
      # fine-grained token with contents:write on safegrd/homebrew-tap. Without
      # it the job fails rather than skipping: a tap that silently stops
      # following releases leaves `brew upgrade` customers on an old binary.
      - name: Commit the new formula to safegrd/homebrew-tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN is not set; the release is published but brew still installs the previous version."
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/safegrd/homebrew-tap.git" tap
          mkdir -p tap/Formula
          sh scripts/homebrew-formula.sh "$version" dist/checksums.txt > tap/Formula/safegrd.rb
          cd tap
          git config user.name "safegrd-release"
          git config user.email "release@safegrd.dev"
          git add Formula/safegrd.rb
          git diff --cached --quiet && { echo "formula already at $version"; exit 0; }
          git commit -m "safegrd ${version}"
          git push origin HEAD
