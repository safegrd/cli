image:
  repository: ghcr.io/safegrd/cli
  # Empty runs the CLI release this chart was cut with (its appVersion). A
  # tag can also name the Postgres client the image carries, e.g. 0.0.10-pg18.
  tag: ""
  pullPolicy: IfNotPresent

# The Secret holding config.yaml and, when you hold the key yourself,
# daemon.key. Create it from a config written by `safegrd enroll`:
#
#   kubectl create secret generic safegrd \
#     --from-file=config.yaml=$HOME/.safegrd/config.yaml \
#     --from-file=daemon.key=$HOME/.safegrd/keys/daemon.key
#
# The config names its key as keys/daemon.key, beside itself, which is where
# the pod puts it.
existingSecret: safegrd

# Extra environment, such as the variable a surface's
# `credential: {from: env, name: ...}` reads.
env: []
#  - name: APP_DATABASE_URL
#    valueFrom:
#      secretKeyRef: { name: app-database, key: url }

# The daemon's state: last backup per surface, the long-term retention slots,
# and the throwaway Postgres cluster a sandbox drill restores into. Kept on a
# volume so a restart does not take an extra backup. Size it for the largest
# database the daemon backs up plus a quarter: a drill that would not leave 5%
# of the volume free runs in memory instead, and the console says so.
persistence:
  enabled: true
  size: 2Gi
  storageClass: ""

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 1Gi

nodeSelector: {}
tolerations: []
affinity: {}
